<h1>쿠벤팅 홈페이지 시안</h1>
<p class="lead">같은 내용을 다른 판으로. 공통점은 「광고판 + 경품 이벤트」를 앞에 세운 것.</p>
<a class="card" href="/lab/a.html"><b>A · 밝은 매장 마케팅</b><span>흰 바탕, 남색 글자, 귤색 강조. 실제 매장 카운터 사진 속 태블릿에 광고판 화면이 돈다.</span></a>
<a class="card" href="/lab/b.html"><b>B · 매거진처럼</b><span>차가운 흰 바탕, 먹색 큰 글자, 주황 하나. 각진 모서리, 영어 장 머리(SIGNAGE · LUCKY DRAW).</span></a>
<a class="card" href="/lab/c.html"><b>C · 밝고 경쾌하게</b><span>해바라기 노랑, 굵은 한글 제목, 경품 스티커, 말풍선 질문.</span></a>
<a class="card" href="/"><b>지금 시안 · 어두운 남색 + 금색</b><span>비교용. 3D 개봉과 금빛 연출이 앞에 선다.</span></a>
