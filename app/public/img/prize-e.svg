<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0%"   stop-color="#2A3E6E"/>
      <stop offset="62%"  stop-color="#1B2A4E"/>
      <stop offset="100%" stop-color="#111B33"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#F2D89A"/>
      <stop offset="42%"  stop-color="#C9A24B"/>
      <stop offset="72%"  stop-color="#E7CC86"/>
      <stop offset="100%" stop-color="#A8822F"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#E7CC86" stop-opacity="0"/>
      <stop offset="100%" stop-color="#E7CC86" stop-opacity=".16"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#24365F"/>
      <stop offset="100%" stop-color="#1A2748"/>
    </linearGradient>

    <!-- 지폐 느낌의 잔무늬 -->
    <pattern id="guilloche" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <path d="M0 13 Q6.5 3 13 13 T26 13" fill="none" stroke="#C9A24B" stroke-width="1" opacity=".16"/>
    </pattern>

    <!-- 쿠폰 모양: 좌우가 반원으로 파인 카드 -->
    <path id="coupon"
      d="M140,262 H860 a34,34 0 0 1 34,34 V452
         a48,48 0 0 0 0,96 V704 a34,34 0 0 1 -34,34 H140
         a34,34 0 0 1 -34,-34 V548 a48,48 0 0 0 0,-96 V296
         a34,34 0 0 1 34,-34 Z"/>
    <clipPath id="clipCoupon"><use href="#coupon"/></clipPath>
  </defs>

  <rect width="1000" height="1000" fill="url(#bg)"/>

  <!-- 뒤에서 퍼지는 빛줄기 — 중심에서 멀어질수록 옅어진다 -->
  <g transform="translate(500 500)">
    <g fill="url(#ray)">
      <path d="M-26,-500 L26,-500 L0,-120 Z"/>
      <path d="M-26,-500 L26,-500 L0,-120 Z" transform="rotate(30)"/>
      <path d="M-26,-500 L26,-500 L0,-120 Z" transform="rotate(65)"/>
      <path d="M-26,-500 L26,-500 L0,-120 Z" transform="rotate(100)"/>
      <path d="M-26,-500 L26,-500 L0,-120 Z" transform="rotate(140)"/>
      <path d="M-26,-500 L26,-500 L0,-120 Z" transform="rotate(180)"/>
      <path d="M-26,-500 L26,-500 L0,-120 Z" transform="rotate(215)"/>
      <path d="M-26,-500 L26,-500 L0,-120 Z" transform="rotate(255)"/>
      <path d="M-26,-500 L26,-500 L0,-120 Z" transform="rotate(295)"/>
      <path d="M-26,-500 L26,-500 L0,-120 Z" transform="rotate(330)"/>
    </g>
  </g>

  <!-- 흩뿌린 별 -->
  <g fill="#E7CC86">
    <path d="M186,168 q10,-34 20,0 q34,10 0,20 q-10,34 -20,0 q-34,-10 0,-20 Z" opacity=".9"/>
    <path d="M834,196 q7,-24 14,0 q24,7 0,14 q-7,24 -14,0 q-24,-7 0,-14 Z" opacity=".75"/>
    <path d="M126,806 q7,-24 14,0 q24,7 0,14 q-7,24 -14,0 q-24,-7 0,-14 Z" opacity=".6"/>
    <path d="M862,828 q10,-34 20,0 q34,10 0,20 q-10,34 -20,0 q-34,-10 0,-20 Z" opacity=".85"/>
    <circle cx="742" cy="132" r="6" opacity=".7"/>
    <circle cx="252" cy="884" r="7" opacity=".55"/>
    <circle cx="906" cy="520" r="5" opacity=".5"/>
    <circle cx="82"  cy="470" r="5" opacity=".5"/>
  </g>

  <!-- 쿠폰 본체 -->
  <g>
    <use href="#coupon" fill="url(#paper)"/>
    <g clip-path="url(#clipCoupon)">
      <rect x="90" y="240" width="820" height="520" fill="url(#guilloche)"/>
      <!-- 비스듬한 광택 -->
      <path d="M60,760 L420,200 L560,200 L200,760 Z" fill="#FFFFFF" opacity=".05"/>
    </g>
    <use href="#coupon" fill="none" stroke="url(#gold)" stroke-width="7"/>
    <use href="#coupon" fill="none" stroke="#C9A24B" stroke-width="2.5"
         stroke-dasharray="3 11" stroke-linecap="round"
         transform="translate(500 500) scale(.955) translate(-500 -500)" opacity=".85"/>
  </g>

  <!-- 금액 -->
  <g text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
    <text x="500" y="382" font-size="46" font-weight="800" letter-spacing="16" fill="#E7CC86" opacity=".92">할 인 권</text>

    <!-- 숫자와 '원'을 한 덩어리로 두어 자동으로 가운데 정렬되게 한다 -->
    <text x="500" y="586" font-size="198" font-weight="900" letter-spacing="-6" fill="url(#gold)">1,000<tspan
          font-size="90" font-weight="800" letter-spacing="0" fill="#E7CC86" dx="14">원</tspan></text>

    <line x1="352" y1="642" x2="648" y2="642" stroke="#C9A24B" stroke-width="3" opacity=".5"/>
  </g>

  <!-- 아래 문구 -->
  <text x="500" y="898" text-anchor="middle"
        font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"
        font-size="34" font-weight="700" letter-spacing="10" fill="#8FA0C2" opacity=".8">DISCOUNT COUPON</text>
</svg>
