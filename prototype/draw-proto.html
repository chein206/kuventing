<!doctype html>
<html lang="ko" data-theme="warm">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>뽑기 프로토타입 — 테마 3종</title>
<style>
/* ============ 공통 리셋 ============ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  background:var(--page);color:var(--ink);
  display:flex;flex-direction:column;align-items:center;
  transition:background .35s ease,color .35s ease;
  overflow-x:hidden;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ============ 테마 : 따뜻한 (동네 식당) ============ */
[data-theme="warm"]{
  --page:#EFE7DA; --surf:#FCF8F1; --surf-2:#F3EADB;
  --ink:#2A211A; --ink-dim:#8A7A67; --line:#E0D3BE;
  --accent:#C4442A; --accent-ink:#FFF6EE; --gold:#B8892F;
  --radius:14px; --radius-sm:9px;
  --shadow:0 2px 0 rgba(120,95,60,.13), 0 10px 24px -14px rgba(80,55,25,.5);
  --tk-face:linear-gradient(150deg,#E8873C,#D65A2A);
  --tk-ink:#FFF3E4; --tk-used:#DED2BE; --tk-used-ink:#9C8B74;
  --font-strong:800; --grid-gap:6px;
  --ga:#B8892F; --gb:#7E8794; --gc:#A2673B; --gd:#4E7C8C; --ge:#9B9184;
  --glow:none;
}
/* ============ 테마 : 모던 (미니멀) ============ */
[data-theme="modern"]{
  --page:#0E0E10; --surf:#18181B; --surf-2:#202024;
  --ink:#FAFAFA; --ink-dim:#8B8B93; --line:#2B2B31;
  --accent:#D7FF3E; --accent-ink:#131313; --gold:#D7FF3E;
  --radius:6px; --radius-sm:4px;
  --shadow:0 12px 30px -18px rgba(0,0,0,.9);
  --tk-face:linear-gradient(160deg,#2E2E35,#232329);
  --tk-ink:#EDEDED; --tk-used:#141417; --tk-used-ink:#5B5B63;
  --font-strong:700; --grid-gap:5px;
  --ga:#D7FF3E; --gb:#9FA6B2; --gc:#C08A5A; --gd:#6FA8C7; --ge:#6C6C74;
  --glow:none;
}
/* ============ 테마 : 네온 (게임) ============ */
[data-theme="neon"]{
  --page:#07051A; --surf:#140F35; --surf-2:#1C1545;
  --ink:#F2ECFF; --ink-dim:#9186C7; --line:#2E2270;
  --accent:#FF3DA6; --accent-ink:#FFFFFF; --gold:#FFD24A;
  --radius:12px; --radius-sm:8px;
  --shadow:0 0 0 1px rgba(122,86,255,.35), 0 14px 40px -18px rgba(255,61,166,.7);
  --tk-face:linear-gradient(155deg,#FF8A3D,#F0442E);
  --tk-ink:#FFF6E9; --tk-used:#191046; --tk-used-ink:#6E62B5;
  --font-strong:800; --grid-gap:6px;
  --ga:#FFD24A; --gb:#7FE6FF; --gc:#FF9E4A; --gd:#7A8CFF; --ge:#8579C6;
  --glow:0 0 14px rgba(255,61,166,.55);
}

/* ============ 프로토타입 전용 툴바 ============ */
.devbar{
  width:100%;background:#000;color:#fff;display:flex;gap:6px;align-items:center;
  padding:8px 12px;font-size:12px;position:sticky;top:0;z-index:80;flex-wrap:wrap
}
.devbar b{font-weight:700;opacity:.55;letter-spacing:.02em;margin-right:2px}
.devbar button{
  border:1px solid #ffffff30;border-radius:99px;padding:5px 12px;font-size:12px;
  color:#fff;transition:.15s
}
.devbar button[aria-pressed="true"]{background:#fff;color:#000;border-color:#fff;font-weight:700}
.devbar .sp{flex:1}

/* ============ 레이아웃 ============ */
.app{width:100%;max-width:430px;flex:1;display:flex;flex-direction:column;position:relative}
.screen{display:none;flex-direction:column;flex:1;padding:0 14px 28px}
.screen.on{display:flex;animation:fadeUp .32s cubic-bezier(.2,.7,.3,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ============ 헤더 ============ */
.hd{display:flex;align-items:flex-end;gap:10px;padding:20px 2px 14px}
.hd .back{
  width:34px;height:34px;border-radius:99px;border:1px solid var(--line);
  background:var(--surf);display:grid;place-items:center;font-size:15px;flex:none;box-shadow:var(--shadow)
}
.hd .tt{flex:1;min-width:0}
.hd .shop{font-size:11px;color:var(--ink-dim);letter-spacing:.08em;font-weight:600}
.hd h1{font-size:20px;font-weight:var(--font-strong);letter-spacing:-.02em;margin-top:2px}
.stock{text-align:right;flex:none}
.stock .lb{font-size:10px;color:var(--ink-dim);letter-spacing:.06em}
.stock .nm{font-size:19px;font-weight:var(--font-strong);letter-spacing:-.03em;line-height:1.1}
.stock .nm i{font-style:normal;color:var(--ink-dim);font-size:13px}

/* ============ 상품 목록 ============ */
.prizes{display:flex;flex-direction:column;gap:8px}
.pz{
  display:flex;gap:11px;align-items:center;background:var(--surf);
  border:1px solid var(--line);border-radius:var(--radius);padding:11px;
  box-shadow:var(--shadow);transition:.25s
}
.pz.out{opacity:.4;filter:saturate(.25)}
.badge{
  width:42px;height:42px;border-radius:99px;flex:none;display:grid;place-items:center;
  color:#fff;font-weight:800;font-size:17px;letter-spacing:-.02em;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)
}
.pz-body{flex:1;min-width:0}
.pz-name{font-size:14px;font-weight:700;letter-spacing:-.02em;line-height:1.3}
.pz-sub{font-size:11px;color:var(--ink-dim);margin-top:1px}
.gauge{display:flex;gap:2px;margin-top:7px;height:9px;overflow:hidden}
.gauge i{flex:1;min-width:2px;border-radius:2px;background:var(--line)}
.gauge i.f{background:var(--accent)}
.pz-left{text-align:right;flex:none;padding-left:4px}
.pz-left .n{font-size:20px;font-weight:var(--font-strong);line-height:1;letter-spacing:-.03em}
.pz-left .l{font-size:9px;color:var(--ink-dim);margin-top:3px;letter-spacing:.05em}
.pz.last .badge{background:linear-gradient(140deg,var(--gold),var(--accent))}

/* ============ 큰 버튼 ============ */
.cta{
  margin-top:auto;padding-top:16px;position:sticky;bottom:0;
  background:linear-gradient(to top,var(--page) 62%,transparent)
}
.btn{
  width:100%;padding:16px;border-radius:var(--radius);background:var(--accent);
  color:var(--accent-ink);font-weight:800;font-size:16px;letter-spacing:-.01em;
  box-shadow:var(--shadow),var(--glow);transition:transform .12s
}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn.ghost{background:var(--surf);color:var(--ink);border:1px solid var(--line)}

/* ============ 티켓 그리드 ============ */
.gridwrap{flex:1;min-height:0}
.note{
  font-size:12px;color:var(--ink-dim);text-align:center;margin:2px 0 12px;line-height:1.5
}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--grid-gap)}
.tk{
  aspect-ratio:1/.68;border-radius:var(--radius-sm);background:var(--tk-face);
  position:relative;display:grid;place-items:center;overflow:hidden;
  box-shadow:0 2px 6px -3px rgba(0,0,0,.5);transition:transform .14s,box-shadow .2s
}
.tk::after{
  content:"";position:absolute;inset:auto 0 20% 0;height:3px;
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.55) 0 2px,transparent 2px 4px);
  opacity:.7
}
.tk .dot{
  width:13px;height:13px;border-radius:99px;border:2px solid rgba(255,255,255,.75);
  position:absolute;top:7px;left:7px
}
.tk .kj{
  position:absolute;top:6px;right:7px;font-size:8px;font-weight:800;
  color:var(--tk-ink);opacity:.85;letter-spacing:-.02em
}
.tk:active{transform:scale(.94)}
.tk.sel{outline:3px solid var(--accent);outline-offset:2px;transform:translateY(-3px);box-shadow:var(--glow),0 8px 16px -8px rgba(0,0,0,.6)}
.tk.used{background:var(--tk-used);box-shadow:none;pointer-events:none}
.tk.used::after{display:none}
.tk.used .dot,.tk.used .kj{display:none}
.tk.used span{font-size:15px;font-weight:800;letter-spacing:-.03em}
.tk.used span::after{content:"상";font-size:9px;font-weight:600;opacity:.65;margin-left:1px}

.selbar{
  display:flex;align-items:center;gap:8px;background:var(--surf);border:1px solid var(--line);
  border-radius:var(--radius);padding:10px 12px;margin-bottom:12px;box-shadow:var(--shadow)
}
.selbar p{flex:1;font-size:13px;font-weight:600}
.selbar p b{color:var(--accent)}
.selbar button{
  font-size:12px;font-weight:700;padding:8px 13px;border-radius:99px;
  border:1px solid var(--line);background:var(--surf-2)
}

/* ============ 오픈 화면 ============ */
.openwrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center}
.openwrap h2{font-size:17px;font-weight:var(--font-strong);letter-spacing:-.02em;line-height:1.5}
.openwrap h2 small{display:block;font-size:12px;font-weight:500;color:var(--ink-dim);margin-top:5px}
.card{
  width:250px;height:158px;border-radius:12px;background:var(--tk-face);
  position:relative;overflow:hidden;box-shadow:0 18px 36px -18px rgba(0,0,0,.8),var(--glow);
  touch-action:none
}
.card .lbl{
  position:absolute;inset:0;display:grid;place-items:center;color:var(--tk-ink);
  font-size:13px;font-weight:700;padding:0 34px;line-height:1.4;text-align:center
}
.card .bar{
  position:absolute;left:0;bottom:16px;width:100%;height:14px;
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.6) 0 3px,transparent 3px 6px)
}
.knob{
  position:absolute;left:10px;top:50%;transform:translateY(-50%);
  width:38px;height:38px;border-radius:99px;background:#37D66B;
  box-shadow:0 0 0 5px rgba(55,214,107,.28),0 3px 8px rgba(0,0,0,.35);
  display:grid;place-items:center;color:#fff;font-size:17px;font-weight:900;
  animation:nudge 1.5s ease-in-out infinite
}
@keyframes nudge{0%,100%{transform:translate(0,-50%)}50%{transform:translate(9px,-50%)}}
.knob.drag{animation:none}
.track{
  position:absolute;left:52px;right:14px;top:50%;transform:translateY(-50%);height:2px;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.55) 0 6px,transparent 6px 12px)
}
.card.opened{animation:burst .5s cubic-bezier(.3,1.4,.5,1) forwards}
@keyframes burst{60%{transform:scale(1.08) rotate(-2deg)}100%{transform:scale(.4);opacity:0}}
.openbtns{display:flex;gap:9px}
.openbtns button{
  padding:12px 22px;border-radius:99px;font-weight:800;font-size:14px;
  border:1px solid var(--line);background:var(--surf);box-shadow:var(--shadow)
}
.openbtns button.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}

/* ============ 결과 화면 ============ */
.result{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;position:relative;padding:24px 0}
.congrats{font-size:13px;font-weight:700;letter-spacing:.16em;color:var(--ink-dim)}
.rgrade{
  width:110px;height:110px;border-radius:99px;display:grid;place-items:center;
  font-size:46px;font-weight:900;color:#fff;letter-spacing:-.04em;
  box-shadow:inset 0 0 0 4px rgba(255,255,255,.3),0 16px 36px -14px rgba(0,0,0,.7);
  animation:pop .55s cubic-bezier(.2,1.5,.4,1) both
}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
.rname{font-size:25px;font-weight:var(--font-strong);letter-spacing:-.035em;line-height:1.25;padding:0 20px}
.rsub{font-size:12px;color:var(--ink-dim)}
.coupon{
  width:100%;background:var(--surf);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow);margin-top:6px
}
.coupon .cl{font-size:10px;color:var(--ink-dim);letter-spacing:.14em;font-weight:700}
.coupon .cc{
  font-size:32px;font-weight:900;letter-spacing:.12em;margin:5px 0 3px;
  font-family:ui-monospace,'SFMono-Regular',Menlo,monospace
}
.coupon .cx{font-size:11px;color:var(--ink-dim)}
.lastone{
  font-size:11px;font-weight:800;letter-spacing:.1em;padding:5px 13px;border-radius:99px;
  background:linear-gradient(120deg,var(--gold),var(--accent));color:#fff
}
.spark{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.spark i{
  position:absolute;width:7px;height:7px;border-radius:1px;
  animation:fall linear forwards;opacity:0
}
@keyframes fall{
  0%{opacity:0;transform:translateY(-30px) rotate(0)}
  12%{opacity:1}
  100%{opacity:0;transform:translateY(340px) rotate(540deg)}
}
.after{width:100%;background:var(--surf-2);border-radius:var(--radius);padding:12px;margin-top:4px}
.after .at{font-size:11px;color:var(--ink-dim);margin-bottom:8px;font-weight:600}
.after .row{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.bonus{
  width:100%;border-radius:var(--radius);padding:13px 14px;margin-top:2px;text-align:left;
  background:linear-gradient(120deg,var(--gold),var(--accent));color:#fff;
  display:flex;align-items:center;gap:11px;box-shadow:var(--shadow),var(--glow);
  animation:pop .5s cubic-bezier(.2,1.4,.4,1) .25s both
}
.bonus .bi{
  width:34px;height:34px;border-radius:99px;flex:none;display:grid;place-items:center;
  background:rgba(255,255,255,.22);font-size:16px
}
.bonus .bt{font-size:10px;font-weight:800;letter-spacing:.14em;opacity:.85}
.bonus .bn{font-size:14px;font-weight:800;letter-spacing:-.02em;margin-top:2px;line-height:1.3}
.chip{
  font-size:11px;font-weight:700;padding:5px 10px;border-radius:99px;
  background:var(--surf);border:1px solid var(--line)
}
.chip.z{opacity:.35}
</style>
</head>
<body>

<div class="devbar">
  <b>테마</b>
  <button data-t="warm" aria-pressed="true">따뜻한</button>
  <button data-t="modern" aria-pressed="false">모던</button>
  <button data-t="neon" aria-pressed="false">네온</button>
  <span class="sp"></span>
  <button id="reset">박스 리셋</button>
  <button id="ff">40장 소진</button>
</div>

<div class="app">

  <!-- 1. 상품 목록 -->
  <section class="screen on" id="s-list">
    <div class="hd">
      <div class="tt">
        <div class="shop">멘야 코바야시 · 합정점</div>
        <h1>오픈 기념 뽑기</h1>
      </div>
      <div class="stock">
        <div class="lb">잔여 / 총</div>
        <div class="nm"><span id="leftN">50</span><i>/50</i></div>
      </div>
    </div>
    <div class="prizes" id="prizes"></div>
    <div class="cta"><button class="btn" id="go">뽑으러 가기</button></div>
  </section>

  <!-- 2. 티켓 그리드 -->
  <section class="screen" id="s-grid">
    <div class="hd">
      <button class="back" data-go="s-list">←</button>
      <div class="tt"><h1>티켓 고르기</h1></div>
      <div class="stock">
        <div class="lb">잔여 / 총</div>
        <div class="nm"><span id="leftN2">50</span><i>/50</i></div>
      </div>
    </div>
    <div class="selbar">
      <p><b id="selN">0</b>/1 선택됨</p>
      <button id="rand">랜덤 선택</button>
    </div>
    <div class="gridwrap">
      <div class="grid" id="grid"></div>
      <p class="note">이미 나간 티켓은 등급이 공개됩니다.<br>남은 티켓에 무엇이 들었는지 셀 수 있습니다.</p>
    </div>
    <div class="cta"><button class="btn" id="start" disabled>뽑기 시작</button></div>
  </section>

  <!-- 3. 오픈 -->
  <section class="screen" id="s-open">
    <div class="openwrap">
      <h2>뽑기를 시작합니다<small>초록 손잡이를 오른쪽으로 미세요</small></h2>
      <div class="card" id="card">
        <div class="lbl">멘야 코바야시<br>오픈 기념 뽑기</div>
        <div class="track"></div>
        <div class="bar"></div>
        <div class="knob" id="knob">›</div>
      </div>
      <div class="openbtns">
        <button class="pri" id="openNow">바로 열기</button>
      </div>
    </div>
  </section>

  <!-- 4. 결과 -->
  <section class="screen" id="s-result">
    <div class="result" id="resultBox">
      <div class="spark" id="spark"></div>
      <div id="loBadge"></div>
      <div class="congrats">축하합니다</div>
      <div class="rgrade" id="rg">E</div>
      <div class="rname" id="rn">1,000원 할인</div>
      <div class="rsub" id="rs">다음 방문 시 사용 · 7일 이내</div>
      <div id="bonus"></div>
      <div class="coupon">
        <div class="cl">쿠폰 코드</div>
        <div class="cc" id="code">K7F-2M9</div>
        <div class="cx">계산 시 직원에게 보여주세요 · 1회만 사용 가능</div>
      </div>
      <div class="after">
        <div class="at">남은 티켓</div>
        <div class="row" id="afterRow"></div>
      </div>
    </div>
    <div class="cta"><button class="btn ghost" id="again">그리드로 돌아가기</button></div>
  </section>

</div>

<script>
/* ---------- 데이터 ---------- */
const TOTAL = 50;
const PRIZES = [
  {id:'A', name:'차슈덮밥 세트 무료',  sub:'그 자리에서 사용',        qty:1,  color:'var(--ga)'},
  {id:'B', name:'라멘 1그릇 무료',     sub:'그 자리에서 사용',        qty:2,  color:'var(--gb)'},
  {id:'C', name:'교자 무료',           sub:'그 자리에서 사용',        qty:4,  color:'var(--gc)'},
  {id:'D', name:'음료 무료',           sub:'다음 방문 · 7일 이내',    qty:8,  color:'var(--gd)'},
  {id:'E', name:'1,000원 할인',        sub:'다음 방문 · 7일 이내',    qty:35, color:'var(--ge)'},
];
const LAST_ONE = {name:'차슈덮밥 세트 무료 + 굿즈', sub:'마지막 티켓 확정 보상'};

/* ---------- 상태 ---------- */
let deck = [], drawn = [], sel = null, current = null;

function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }
function build(){
  deck = shuffle(PRIZES.flatMap(p=>Array(p.qty).fill(p.id)));
  drawn = Array(TOTAL).fill(null);
  sel = null; current = null;
}
const leftCount = () => drawn.filter(x=>!x).length;
const leftOf = id => deck.filter((g,i)=>g===id && !drawn[i]).length;
const prize = id => PRIZES.find(p=>p.id===id);

/* ---------- 화면 전환 ---------- */
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on', s.id===id));
  window.scrollTo(0,0);
}

/* ---------- 렌더 : 상품 목록 ---------- */
function renderPrizes(){
  const el = document.getElementById('prizes');
  el.innerHTML = PRIZES.map(p=>{
    const l = leftOf(p.id);
    const cells = Array.from({length:Math.min(p.qty,14)},(_,i)=>
      `<i class="${i < Math.round(l/p.qty*Math.min(p.qty,14)) ? 'f':''}"></i>`).join('');
    return `<div class="pz ${l===0?'out':''}">
      <div class="badge" style="background:${p.color}">${p.id}</div>
      <div class="pz-body">
        <div class="pz-name">${p.name}</div>
        <div class="pz-sub">${p.sub}</div>
        <div class="gauge">${cells}</div>
      </div>
      <div class="pz-left"><div class="n">${l}</div><div class="l">잔여</div></div>
    </div>`;
  }).join('') + `<div class="pz last">
      <div class="badge">★</div>
      <div class="pz-body">
        <div class="pz-name">라스트 보상 — ${LAST_ONE.name}</div>
        <div class="pz-sub">${LAST_ONE.sub}</div>
      </div>
      <div class="pz-left"><div class="n">1</div><div class="l">잔여</div></div>
    </div>`;
  document.getElementById('leftN').textContent = leftCount();
  document.getElementById('leftN2').textContent = leftCount();
}

/* ---------- 렌더 : 티켓 그리드 ---------- */
function renderGrid(){
  const el = document.getElementById('grid');
  el.innerHTML = Array.from({length:TOTAL},(_,i)=>{
    const g = drawn[i];
    if(g) return `<div class="tk used"><span style="color:${prize(g).color}">${g}</span></div>`;
    return `<div class="tk ${sel===i?'sel':''}" data-i="${i}">
      <div class="dot"></div><div class="kj">뽑기</div></div>`;
  }).join('');
  document.getElementById('selN').textContent = sel===null?0:1;
  document.getElementById('start').disabled = sel===null;
  document.getElementById('leftN2').textContent = leftCount();
}
document.getElementById('grid').addEventListener('click', e=>{
  const t = e.target.closest('.tk[data-i]'); if(!t) return;
  const i = +t.dataset.i; sel = (sel===i ? null : i); renderGrid();
});
document.getElementById('rand').onclick = ()=>{
  const open = drawn.map((d,i)=>d?null:i).filter(v=>v!==null);
  if(!open.length) return;
  sel = open[Math.random()*open.length|0]; renderGrid();
  document.querySelector('.tk.sel')?.scrollIntoView({block:'center',behavior:'smooth'});
};

/* ---------- 오픈 ---------- */
document.getElementById('go').onclick = ()=>{ renderGrid(); show('s-grid'); };
document.querySelectorAll('[data-go]').forEach(b=> b.onclick = ()=>{ renderPrizes(); show(b.dataset.go); });
document.getElementById('start').onclick = ()=>{ resetCard(); show('s-open'); };

const card = document.getElementById('card'), knob = document.getElementById('knob');
let dragging=false, sx=0;
function resetCard(){ card.classList.remove('opened'); knob.classList.remove('drag'); knob.style.left='10px'; }
knob.addEventListener('pointerdown', e=>{ dragging=true; sx=e.clientX; knob.setPointerCapture(e.pointerId); knob.classList.add('drag'); });
knob.addEventListener('pointermove', e=>{
  if(!dragging) return;
  const dx = Math.max(0, Math.min(card.clientWidth-58, e.clientX-sx));
  knob.style.left = (10+dx)+'px';
  if(dx > card.clientWidth*0.58){ dragging=false; doOpen(); }
});
knob.addEventListener('pointerup', ()=>{ if(dragging){ dragging=false; knob.style.left='10px'; knob.classList.remove('drag'); } });
document.getElementById('openNow').onclick = doOpen;

function doOpen(){
  if(sel===null) return;
  card.classList.add('opened');
  const isLast = leftCount()===1;
  drawn[sel] = deck[sel];
  current = {grade: deck[sel], last: isLast};
  sel = null;
  setTimeout(()=>{ renderResult(); show('s-result'); }, 460);
}

/* ---------- 결과 ---------- */
function code(){
  const C='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const p=n=>Array.from({length:n},()=>C[Math.random()*C.length|0]).join('');
  return p(3)+'-'+p(3);
}
function renderResult(){
  const p = prize(current.grade);
  const showLast = current.last;
  // 라스트 보상은 원래 등급을 대체하지 않고 "추가"로 얹는다
  document.getElementById('loBadge').innerHTML = showLast ? `<div class="lastone">LAST ONE</div>` : '';
  document.getElementById('rg').textContent = p.id;
  document.getElementById('rg').style.background = p.color;
  document.getElementById('rn').textContent = p.name;
  document.getElementById('rs').textContent  = p.sub;
  document.getElementById('bonus').innerHTML = showLast
    ? `<div class="bonus"><div class="bi">★</div><div>
         <div class="bt">마지막 티켓 확정 보상</div>
         <div class="bn">${LAST_ONE.name}</div></div></div>`
    : '';
  document.getElementById('code').textContent = code();
  document.getElementById('afterRow').innerHTML = PRIZES.map(x=>{
    const l = leftOf(x.id);
    return `<span class="chip ${l===0?'z':''}">${x.id}상 ${l}</span>`;
  }).join('');
  sparkle(showLast || ['A','B'].includes(p.id) ? 60 : 22);
}
function sparkle(n){
  const box = document.getElementById('spark'); box.innerHTML='';
  const cols=['var(--gold)','var(--accent)','var(--gb)','var(--gd)'];
  for(let i=0;i<n;i++){
    const s=document.createElement('i');
    s.style.left = Math.random()*100+'%';
    s.style.top  = (-10 - Math.random()*40)+'px';
    s.style.background = cols[i%cols.length];
    s.style.animationDuration = (1.1+Math.random()*1.1)+'s';
    s.style.animationDelay = (Math.random()*.5)+'s';
    box.appendChild(s);
  }
}
document.getElementById('again').onclick = ()=>{ renderGrid(); renderPrizes(); show('s-grid'); };

/* ---------- 테마 / 개발 도구 ---------- */
document.querySelectorAll('.devbar [data-t]').forEach(b=> b.onclick = ()=>{
  document.documentElement.dataset.theme = b.dataset.t;
  document.querySelectorAll('.devbar [data-t]').forEach(x=>x.setAttribute('aria-pressed', x===b));
});
document.getElementById('reset').onclick = ()=>{ build(); renderPrizes(); renderGrid(); show('s-list'); };
document.getElementById('ff').onclick = ()=>{
  const open = drawn.map((d,i)=>d?null:i).filter(v=>v!==null);
  shuffle(open).slice(0, Math.max(0, open.length-10)).forEach(i=> drawn[i]=deck[i]);
  renderPrizes(); renderGrid();
};

/* ---------- 시작 ---------- */
build(); renderPrizes(); renderGrid();
</script>
</body>
</html>
